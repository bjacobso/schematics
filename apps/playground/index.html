<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        const storageKey = "schematics-playground-theme";
        let storedTheme = null;
        try {
          storedTheme = localStorage.getItem(storageKey);
        } catch {
          storedTheme = null;
        }

        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : prefersDark
              ? "dark"
              : "light";

        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      html {
        background: #f6f8fb;
        color: #1c2127;
      }

      html[data-theme="dark"] {
        background: #11161d;
        color: #e8edf3;
      }
    </style>
    <title>Schematics — Composable libraries built on Effect</title>
    <meta
      name="description"
      content="Describe the structure. Keep the behavior inspectable. Composable libraries for schemas, relationships, rules, and workflows, built on Effect."
    />
    <link rel="canonical" href="https://schematics.run/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Schematics — Describe the structure. Keep the behavior inspectable."
    />
    <meta
      property="og:description"
      content="Composable libraries for schemas, relationships, rules, and workflows, built on Effect."
    />
    <meta property="og:url" content="https://schematics.run/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
