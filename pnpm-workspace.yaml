packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

minimumReleaseAge: 0
verifyDepsBeforeRun: false
useNodeVersion: 25.9.0
nodeVersion: 25.9.0

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  workerd: true

overrides:
  # Keep Alchemy's compatible SQL adapters at the tested Effect patch.
  "alchemy@2.0.0-beta.81>@effect/sql-d1": 4.0.3
  "alchemy@2.0.0-beta.81>@effect/sql-sqlite-do": 4.0.3
  # Foldkit's plugin pins 4.0.0 directly. Keep its platform services on the
  # same tested patch as the app; no other consumer's ranges are overridden.
  "@foldkit/vite-plugin@0.27.1>@effect/platform-node": 4.0.3
  "@foldkit/vite-plugin@0.27.1>@effect/platform-node-shared": 4.0.3

peerDependencyRules:
  allowedVersions:
    # Version-scoped compatibility exceptions; see the README for coverage.
    "@schema-reflection/algebra@0.1.0>effect": 4.0.3
    "foldkit@0.168.0>effect": 4.0.3
    "foldkit@0.168.0>@effect/platform-browser": 4.0.3
    "@foldkit/ui@0.168.0>effect": 4.0.3
    "@foldkit/vite-plugin@0.27.1>effect": 4.0.3
    "@foldworks/ui@0.2.0>foldkit": 0.168.0
    "@foldworks/ui@0.2.0>@foldkit/ui": 0.168.0
catalog:
  astro: 7.3.8
  "@astrojs/react": 7.0.1
  "@vitejs/plugin-react": 6.1.2
  foldkit: 0.168.0
  "@foldkit/ui": 0.168.0
  "@foldkit/vite-plugin": 0.27.1
  "@foldworks/ui": 0.2.0
  "@stylexjs/stylex": 0.19.0
  "@stylexjs/unplugin": 0.19.1
  "@schema-reflection/algebra": 0.1.0
  effect: 4.0.3
  "@effect/vitest": 4.0.3
  "@effect/platform-node": 4.0.3
  "@effect/platform-browser": 4.0.3
  "@emotion/react": 11.14.0
  "@emotion/styled": 11.14.1
  "@mui/material": 9.0.1
  "@playwright/test": 1.60.0
  "@types/node": 24.10.1
  "@types/react": 19.2.7
  "@types/react-dom": 19.0.0
  react: 19.2.1
  react-dom: 19.2.1
  tailwindcss: 4.3.0
  tsdown: 0.21.7
  tsx: 4.19.0
  typescript: 6.0.2
  vite: 8.0.13
  vitest: 5.0.4
  "@tailwindcss/vite": 4.3.0

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "esbuild"
  - "msgpackr-extract"
