packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

minimumReleaseAge: 0
verifyDepsBeforeRun: false
useNodeVersion: 25.9.0
nodeVersion: 25.9.0

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  workerd: true

overrides:
  # Alchemy's broad range otherwise retains a beta-era Effect test integration.
  "@effect/vitest": 4.0.0-rc.112
  # platform-node rc.112's caret range otherwise resolves a newer
  # platform-node-shared release that requires a newer Effect RC.
  "@effect/platform-node-shared": 4.0.0-rc.112

peerDependencyRules:
  allowedVersions:
    # algebra 0.1.0 still declares beta.68, but is covered by this workspace's
    # RC.112 typecheck and test suite while its peer metadata catches up.
    "@schema-reflection/algebra>effect": 4.0.0-rc.112

catalog:
  "@schema-reflection/algebra": 0.1.0
  effect: 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@foldkit/vite-plugin": 0.20.0
  "@foldworks/ui": 0.1.0
  "@lucide/icons": 1.40.0
  "@stylexjs/stylex": 0.19.0
  "@stylexjs/unplugin": 0.19.0
  foldkit: 0.156.0
  "@emotion/react": 11.14.0
  "@emotion/styled": 11.14.1
  "@mui/material": 9.0.1
  "@playwright/test": 1.60.0
  "@types/node": 24.10.1
  "@types/react": 19.2.7
  "@types/react-dom": 19.0.0
  react: 19.2.1
  react-dom: 19.2.1
  tailwindcss: 4.3.0
  tsdown: 0.21.7
  tsx: 4.19.0
  typescript: 6.0.2
  vite: 8.0.13
  vitest: 4.1.2
  "@tailwindcss/vite": 4.3.0

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "esbuild"
  - "msgpackr-extract"
